# SPDX-License-Identifier: MIT
# Builds Ferrum natively on Linux, macOS and Windows for every push and pull
# request. Pushing a tag like v0.2.0 also publishes a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos
          - os: windows-2025
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # Work out this build's version before compiling, so the app, its file
      # names and the release all agree (see the release job below).
      - name: Pick the version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            IFS=. read -r major minor patch <<< "$base"
            while gh release view "v$major.$minor.$patch" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
              patch=$((patch + 1))
            done
            version="$major.$minor.$patch"
          fi
          echo "FERRUM_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building Ferrum $version"

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-x11-dev libegl-dev libgl-dev libdbus-1-dev

      - name: Test
        run: cargo test --release --bins

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p pkg/ferrum dist
          cp target/release/ferrum README.md LICENSE pkg/ferrum/
          tar -C pkg -czf dist/ferrum-$FERRUM_VERSION-${{ matrix.name }}.tar.gz ferrum

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: scripts/build-macos.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          mkdir -p pkg/Ferrum dist
          cp target/release/ferrum.exe README.md LICENSE pkg/Ferrum/
          cd pkg && 7z a ../dist/ferrum-$FERRUM_VERSION-${{ matrix.name }}.zip Ferrum

      - uses: actions/upload-artifact@v4
        with:
          name: ferrum-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz

  # EVERY build is published as a versioned nightly release (x.x.x), marked
  # as GitHub's "Latest" release:
  #   push to main → the version in Cargo.toml; if that version is already
  #                  released, the next free patch number (0.4.1 → 0.4.2 → …)
  #   version tag  → that version
  # Bump the major/minor version in Cargo.toml for bigger changes.
  release:
    # Publish whatever platforms built, even if one failed.
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Pick the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          IFS=. read -r major minor patch <<< "$base"
          while gh release view "v$major.$minor.$patch" -R "$REPO" >/dev/null 2>&1; do
            patch=$((patch + 1))
          done
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Publish the release (marked as latest)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nothing built, nothing to publish"
            exit 0
          fi
          # A full release, so GitHub marks the newest one "Latest" and
          # /releases/latest points at it.
          args=(--latest --title "Ferrum $VERSION (nightly)")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--verify-tag --generate-notes)
          else
            args+=(--target "$GITHUB_SHA" --notes "Nightly build — not ready for production yet, may contain bugs. Ferrum 0.7.8 and later can update to it from the ☰ menu.

          Built from commit $GITHUB_SHA.")
          fi
          gh release create "v$VERSION" "${files[@]}" -R "$REPO" "${args[@]}"
