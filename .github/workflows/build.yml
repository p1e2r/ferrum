# SPDX-License-Identifier: MIT
# Builds Ferrum natively on Linux, macOS and Windows for every push and pull
# request.
#
# Branches:
#   dev  — day-to-day development: built and tested, nothing published.
#   main — releases: every push publishes the next version (see `release`).
name: Build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Work out this build's version once, so every platform's app, its file
  # names and the release all agree.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the version
        id: pick
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            IFS=. read -r major minor patch <<< "$base"
            # The next version without a release. If GitHub can't be asked,
            # stop here rather than guess (pipefail makes a failed call fail the job).
            tags=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')
            while grep -qx "v$major.$minor.$patch" <<< "$tags"; do
              patch=$((patch + 1))
            done
            version="$major.$minor.$patch"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Ferrum $version"

  build:
    needs: version
    env:
      FERRUM_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos
          - os: windows-2025
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        # The package mirrors sometimes hang; retry, and don't wait forever.
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-x11-dev libegl-dev libgl-dev libdbus-1-dev

      - name: Test
        run: cargo test --release --bins

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p pkg/ferrum dist
          cp target/release/ferrum README.md LICENSE pkg/ferrum/
          tar -C pkg -czf dist/ferrum-$FERRUM_VERSION-${{ matrix.name }}.tar.gz ferrum

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: scripts/build-macos.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          mkdir -p pkg/Ferrum dist
          cp target/release/ferrum.exe README.md LICENSE pkg/Ferrum/
          cd pkg && 7z a ../dist/ferrum-$FERRUM_VERSION-${{ matrix.name }}.zip Ferrum

      - uses: actions/upload-artifact@v4
        with:
          name: ferrum-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz

  # Every push to main is published as the next release (x.y.z), marked as
  # GitHub's "Latest" release (pushes to dev only build and test):
  #   push to main → the version in Cargo.toml; if that version is already
  #                  released, the next free patch number (0.4.1 → 0.4.2 → …)
  #   version tag  → that version
  # Bump the major/minor version in Cargo.toml for bigger changes.
  release:
    # Publish whatever platforms built, even if one failed.
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release (marked as latest)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nothing built, nothing to publish"
            exit 0
          fi
          # Checksums: Ferrum's updater checks downloads against these.
          (cd dist && sha256sum -- * > SHA256SUMS)
          files=(dist/*)
          # A full release, so GitHub marks the newest one "Latest" and
          # /releases/latest points at it. Notes list the changes since the
          # last release.
          args=(--latest --title "Ferrum $VERSION" --generate-notes)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "v$VERSION" "${files[@]}" -R "$REPO" "${args[@]}"
