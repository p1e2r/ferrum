# SPDX-License-Identifier: MIT
# Builds Ferrum natively on Linux, macOS and Windows for every push and pull
# request. Pushing a tag like v0.2.0 also publishes a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-universal
          - os: windows-2025
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev cmake python3 pkg-config \
            libfontconfig-dev libfreetype-dev libharfbuzz-dev libx11-dev libxcb1-dev \
            libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libegl-dev libgl-dev libgles-dev libssl-dev libdbus-1-dev \
            libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake pkg-config
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install -y llvm nasm --no-progress
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\lib" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --release --bins

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p pkg/ferrum dist
          cp target/release/ferrum README.md LICENSE pkg/ferrum/
          tar -C pkg -czf dist/ferrum-${{ matrix.name }}.tar.gz ferrum

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: scripts/build-macos.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          mkdir -p pkg/Ferrum dist
          cp target/release/ferrum.exe README.md LICENSE pkg/Ferrum/
          cd pkg && 7z a ../dist/ferrum-${{ matrix.name }}.zip Ferrum

      - uses: actions/upload-artifact@v4
        with:
          name: ferrum-${{ matrix.name }}
          path: dist/*

  # Every push to main → a "Nightly" pre-release (replaced each time).
  # A version tag (v0.2.0, …) → a pre-release named after the version.
  # All releases are marked pre-release until Ferrum is ready for production.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Remove the previous nightly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Publish nightly pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly (${{ github.sha }})
          prerelease: true
          make_latest: false
          body: |
            Automatic build of the latest commit on `main` — not a stable release, may contain bugs.

            Commit: ${{ github.sha }}
          files: dist/*

      - name: Publish version pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          files: dist/*
          generate_release_notes: true
