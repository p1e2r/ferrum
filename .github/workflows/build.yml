# SPDX-License-Identifier: MIT
# Builds Ferrum natively on Linux, macOS and Windows for every push and pull
# request. Pushing a tag like v0.2.0 also publishes a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-universal
          - os: windows-2025
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev cmake python3 pkg-config \
            libfontconfig-dev libfreetype-dev libharfbuzz-dev libx11-dev libxcb1-dev \
            libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libegl-dev libgl-dev libgles-dev libssl-dev libdbus-1-dev \
            libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake pkg-config
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install -y llvm nasm --no-progress
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\lib" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --release --bins

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p pkg/ferrum dist
          cp target/release/ferrum README.md LICENSE pkg/ferrum/
          tar -C pkg -czf dist/ferrum-${{ matrix.name }}.tar.gz ferrum

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: scripts/build-macos.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          mkdir -p pkg/Ferrum dist
          cp target/release/ferrum.exe README.md LICENSE pkg/Ferrum/
          cd pkg && 7z a ../dist/ferrum-${{ matrix.name }}.zip Ferrum

      - uses: actions/upload-artifact@v4
        with:
          name: ferrum-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz

  # Until Ferrum is ready for production, EVERY build is published as a
  # nightly pre-release:
  #   push to main → "nightly-<commit>" (kept) + "Nightly" (rolling, replaced)
  #   version tag  → that version, also as a pre-release
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish this commit as a nightly
        if: github.ref == 'refs/heads/main'
        run: |
          short="${GITHUB_SHA:0:7}"
          gh release delete "nightly-$short" --cleanup-tag --yes -R "$REPO" || true
          gh release create "nightly-$short" dist/* -R "$REPO" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Nightly ($short)" \
            --notes "Nightly build of commit $GITHUB_SHA — not a stable release, may contain bugs."

      - name: Update the rolling Nightly
        if: github.ref == 'refs/heads/main'
        run: |
          short="${GITHUB_SHA:0:7}"
          gh release delete nightly --cleanup-tag --yes -R "$REPO" || true
          gh release create nightly dist/* -R "$REPO" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Nightly (latest: $short)" \
            --notes "Always the newest build of main ($GITHUB_SHA) — not a stable release, may contain bugs."

      - name: Publish version as a pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* -R "$REPO" \
            --verify-tag --prerelease --latest=false --generate-notes \
            --title "$GITHUB_REF_NAME (pre-release)"
