# SPDX-License-Identifier: MIT
# Builds Ferrum natively on Linux, macOS and Windows, and Ferrum for Android,
# for every push and pull request.
#
# Branches:
#   dev  — day-to-day development: built and tested, nothing published.
#   main — releases: every push publishes the next version (see `release`).
name: Build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Work out this build's version once, so every platform's app, its file
  # names and the release all agree.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the version
        id: pick
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            IFS=. read -r major minor patch <<< "$base"
            # The next version without a release. If GitHub can't be asked,
            # stop here rather than guess (pipefail makes a failed call fail the job).
            tags=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')
            while grep -qx "v$major.$minor.$patch" <<< "$tags"; do
              patch=$((patch + 1))
            done
            version="$major.$minor.$patch"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Ferrum $version"

  build:
    needs: version
    env:
      FERRUM_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos
          - os: windows-2025
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        # The package mirrors sometimes hang; retry, and don't wait forever.
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-x11-dev libegl-dev libgl-dev libdbus-1-dev

      - name: Test
        run: cargo test --release --bins

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p pkg/ferrum dist
          cp target/release/ferrum README.md LICENSE pkg/ferrum/
          tar -C pkg -czf dist/ferrum-$FERRUM_VERSION-${{ matrix.name }}.tar.gz ferrum

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: scripts/build-macos.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          mkdir -p pkg/Ferrum dist
          cp target/release/ferrum.exe README.md LICENSE pkg/Ferrum/
          cd pkg && 7z a ../dist/ferrum-$FERRUM_VERSION-${{ matrix.name }}.zip Ferrum

      - uses: actions/upload-artifact@v4
        with:
          name: ferrum-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz

  # Ferrum for Android (android/): unit tests, a debug build for the emulator
  # test, and the signed release APK. The signing key is in the repository,
  # encrypted; the ANDROID_KEYSTORE_PASSWORD secret unlocks it. Without the
  # secret there's no release APK (a differently signed one couldn't update).
  android:
    needs: version
    runs-on: ubuntu-24.04
    env:
      FERRUM_VERSION: ${{ needs.version.outputs.version }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the debug app
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build the signed release APK
        if: env.KEY_PASSWORD != ''
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/ferrum-release.jks.enc \
            -out "$RUNNER_TEMP/ferrum-release.jks" -pass env:KEY_PASSWORD
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/ferrum-release.jks" ANDROID_KEYSTORE_PASSWORD="$KEY_PASSWORD" \
            ANDROID_KEY_ALIAS=ferrum ANDROID_KEY_PASSWORD="$KEY_PASSWORD"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/ferrum-release.jks"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Ferrum-$FERRUM_VERSION-android.apk"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "../dist/Ferrum-$FERRUM_VERSION-android.apk" | grep -i sha-256

      - name: No signing key
        if: env.KEY_PASSWORD == ''
        run: echo "::warning::The ANDROID_KEYSTORE_PASSWORD secret isn't set, so there's no release APK"

      - uses: actions/upload-artifact@v4
        if: env.KEY_PASSWORD != ''
        with:
          name: ferrum-android
          path: dist/*.apk

  # Runs the Android app on an emulator and keeps screenshots of each screen.
  android-test:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/smoke.sh apk/app-debug.apk shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: shots

      # The latest run's screenshots are also kept on the ci-screenshots branch, to look at without unzipping.
      - name: Keep the screenshots on the ci-screenshots branch
        if: always() && github.event_name == 'push'
        run: |
          set -e
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$GITHUB_REF_NAME" && mv *.png *.txt *.xml "$GITHUB_REF_NAME"/ 2>/dev/null || true
          git add -A
          git commit -qm "Screenshots from $GITHUB_SHA"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" ci-screenshots

  # Every push to main is published as the next release (x.y.z), marked as
  # GitHub's "Latest" release (pushes to dev only build and test):
  #   push to main → the version in Cargo.toml; if that version is already
  #                  released, the next free patch number (0.4.1 → 0.4.2 → …)
  #   version tag  → that version
  # Bump the major/minor version in Cargo.toml for bigger changes.
  release:
    # Publish whatever platforms built, even if one failed.
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [version, build, android]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ferrum-*
          merge-multiple: true

      - name: Publish the release (marked as latest)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nothing built, nothing to publish"
            exit 0
          fi
          # Checksums: Ferrum's updater checks downloads against these.
          (cd dist && sha256sum -- * > SHA256SUMS)
          files=(dist/*)
          # A full release, so GitHub marks the newest one "Latest" and
          # /releases/latest points at it. Notes list the changes since the
          # last release.
          args=(--latest --title "Ferrum $VERSION" --generate-notes)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "v$VERSION" "${files[@]}" -R "$REPO" "${args[@]}"
